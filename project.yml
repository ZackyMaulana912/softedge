name: RoundedCorners
options:
  bundleIdPrefix: com.zackymaulana
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  RoundedCorners:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: RoundedCorners
        CFBundleDisplayName: RoundedCorners
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zackymaulana.roundedcorners
        PRODUCT_NAME: RoundedCorners
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
